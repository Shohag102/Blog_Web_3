<!--templates/base.html-->
{% load static %}
<html>
    <head>
        <title>Django Words</title>
        <link rel="Stylesheet" href="{% static 'css/blog_8style.css' %}"> 
    </head>
    <body>
        <div>
        <header>
            <h2 class="nav-top"><a href="{% url 'home' %}">Django Words</a></h2>
            <h3><div class="nav-undertop"><a href="{% url 'blog_create' %}">+New Blog Post</a></h3>
        </header>
        {% if user.is_authenticated %}
        <p>Hi {{user.username}}!</p>
        <P><a href="{% url 'logout' %}">Log Out</a></P>
        {% else %}
        <p>You are not logged in</p>
        <p><a href="{% url 'login' %}"></a></p>
        {% endif %}
        {% block content %}
        {% endblock content %}
    </div>
    </body>
</html>
